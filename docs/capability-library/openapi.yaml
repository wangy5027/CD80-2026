          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id001
      - *id002
      - name: assetId
        in: query
        schema:
          type: string
      - name: taskId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
    post:
      summary: 显式执行可用 Tool
      operationId: post_invocations
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationInput'
  /invocations/{invocationId}:
    get:
      summary: 调用详情
      operationId: get_invocations_invocationId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invocation'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: invocationId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
  /jobs/{jobId}:
    get:
      summary: 读取后台任务状态
      operationId: get_jobs_jobId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
  /jobs/{jobId}/cancel:
    post:
      summary: 请求取消后台任务
      operationId: post_jobs_jobId_cancel
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: jobId
        in: path
