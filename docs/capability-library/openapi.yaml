openapi: 3.1.0
info:
  title: CD80 Skills and Tools Library API
  version: 0.5.0
  description: 已实现的能力库接口契约；资源允许扩展状态与审计元数据。导入检查不执行代码。
servers:
- url: http://127.0.0.1:8894/desktop/api/capabilities
security:
- sessionCookie: []
paths:
  /assets:
    get:
      summary: 能力目录
      operationId: get_assets
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id001
        name: cursor
        in: query
        schema:
          type: string
      - &id002
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: deleted
        in: query
        description: personal目录默认不含删除项；true仅列出删除项
        schema:
          type: boolean
          default: false
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - skill
          - tool
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - personal
          - public
      - name: status
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
  /assets/{assetId}:
    get:
      summary: 能力详情
      operationId: get_assets_assetId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          headers:
            ETag:
              schema:
                type: string
              description: 用于 If-Match 的资源修订
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
    patch:
      summary: 启用 禁用 归档或恢复
      operationId: patch_assets_assetId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      description: 启用指定版本需有效验证；归档不能用于新会话，禁用阻止旧会话后续调用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPatch'
    delete:
      summary: 删除本人能力并立即停用，保留历史可恢复
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          description: 错误；不存在或非本人404，修订冲突412，版本变化409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{assetId}/versions:
    get:
      summary: 版本列表
      operationId: get_assets_assetId_versions
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionList'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - *id001
      - *id002
  /assets/{assetId}/versions/{versionId}:
    get:
      summary: 版本详情
      operationId: get_assets_assetId_versions_versionId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: versionId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
  /assets/{assetId}/versions/{versionId}/files/{filePath}:
    get:
      summary: 版本原件读取
      operationId: get_assets_assetId_versions_versionId_files_filePath
      responses:
        '200':
          description: 成功
          content:
            text/plain:
              schema:
                type: string
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: versionId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: filePath
        in: path
        required: true
        schema:
          type: string
        description: 版本内相对路径；校验后读取，禁止路径穿越
  /assets/{assetId}/copy:
    post:
      summary: 公共能力加入个人库
      operationId: post_assets_assetId_copy
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedVersion'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmDuplicate:
                  type: boolean
                  default: false
                  description: 已有一致副本时必须在用户确认后设为true
                versionId:
                  type: string
              required:
              - versionId
              additionalProperties: false
  /imports/preview:
    post:
      summary: 只读解析能力原件及静态原用例候选
      operationId: post_imports_preview
      description: 不保存版本、不执行代码或模型。返回的 sha256 可由保存请求的 expectedDigest 核对。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                kind: {type: string, enum: [skill, tool]}
              required: [file]
      responses:
        '200':
          description: 解析结果；testCases 可能含待补预期
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                  manifest: {type: object}
                  testCases:
                    type: array
                    items:
                      $ref: '#/components/schemas/VersionTestCase'
                additionalProperties: true
        default:
          description: 格式或安全检查错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports:
    post:
      summary: 导入或重新导入
      operationId: post_imports
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      description: 只解析检查并保存版本原用例，不执行脚本或联网发现。MCP 描述结果为 connectionId；其他类型结果为 assetId/versionId。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                targetAssetId:
                  type: string
                expectedDigest:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                testCases:
                  type: string
                  description: JSON编码的1至10条版本原用例；不提供时从明确示例或静态声明生成
              required:
              - file
              additionalProperties: false
  /imports/{importId}:
    get:
      summary: 导入检查结果
      operationId: get_imports_importId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: importId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
  /drafts:
    post:
      summary: 创建草稿
      operationId: post_drafts
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftInput'
    get:
      summary: 恢复本人的草稿目录
      operationId: get_drafts
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftList'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id001
      - *id002
  /drafts/{draftId}:
    get:
      summary: 草稿详情
      operationId: get_drafts_draftId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
          headers:
            ETag:
              schema:
                type: string
              description: 用于 If-Match 的资源修订
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
    patch:
      summary: 编辑草稿
      operationId: patch_drafts_draftId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                manifest:
                  type: object
                  additionalProperties: true
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      path: &id003
                        type: string
                        minLength: 1
                        maxLength: 512
                        pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$))(?!.*\\)[^:]+$
                      text:
                        type: string
                    required:
                    - path
                    - text
                    additionalProperties: false
                testCases:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/VersionTestCase'
              required: []
              additionalProperties: false
    delete:
      summary: 删除未引用草稿
      operationId: delete_drafts_draftId
      responses:
        '204':
          description: 成功
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
  /drafts/{draftId}/save:
    post:
      summary: 确认保存版本并检查
      operationId: post_drafts_draftId_save
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                draftRevision:
                  type: integer
                  minimum: 1
                testCases:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/VersionTestCase'
              required:
              - draftRevision
              additionalProperties: false
  /drafts/generate:
    post:
      summary: 从已选消息生成草稿
      operationId: post_drafts_generate
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDraft'
  /connections:
    get:
      summary: 个人连接列表
      operationId: get_connections
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionList'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id001
      - *id002
    post:
      summary: 保存连接配置 不联网
      operationId: post_connections
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionInput'
  /connections/{connectionId}:
    get:
      summary: 连接公开配置
      operationId: get_connections_connectionId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
          headers:
            ETag:
              schema:
                type: string
              description: 用于 If-Match 的资源修订
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
    patch:
      summary: 更新非敏感连接配置
      operationId: patch_connections_connectionId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                endpoint:
                  type: string
                  format: uri
                authMode:
                  type: string
                  enum:
                  - none
                  - bearer
                  - api_key
                headerName:
                  type: string
              required: []
              additionalProperties: false
  /connections/{connectionId}/credentials:
    post:
      summary: 设置或清除凭据
      operationId: post_connections_connectionId_credentials
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInput'
  /connections/{connectionId}/discover:
    post:
      summary: 主动发现 MCP 工具
      operationId: post_connections_connectionId_discover
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      description: 只进行协议协商和工具发现，不执行工具。
  /connections/{connectionId}/tools/import:
    post:
      summary: 从发现快照导入工具
      operationId: post_connections_connectionId_tools_import
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discoveryId:
                  type: string
                toolNames:
                  type: array
                  items:
                    type: string
              required:
              - discoveryId
              - toolNames
              additionalProperties: false
  /validation-suites:
    post:
      summary: 原用例真实验证；第二组不同输入可选
      operationId: post_validation_suites
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 150}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationSuiteInput'
      responses:
        '202':
          description: 已创建作业；读取verificationId的逐案结果，job完成不等于验证通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 请求、准入或配置错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /verifications:
    post:
      summary: 创建样例试运行
      operationId: post_verifications
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationInput'
  /verifications/{verificationId}:
    get:
      summary: 验证结果
      operationId: get_verifications_verificationId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: verificationId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
  /verifications/{verificationId}/review:
    post:
      summary: 确认或拒绝验证效果
      operationId: post_verifications_verificationId_review
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: verificationId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                  - accept
                  - reject
                comment:
                  type: string
              required:
              - decision
              additionalProperties: false
  /invocations:
    get:
      summary: 本人调用记录
