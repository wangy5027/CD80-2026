      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
  /jobs/{jobId}/events:
    get:
      summary: 读取任务事件流
      operationId: get_jobs_jobId_events
      responses:
        '200':
          description: 成功
