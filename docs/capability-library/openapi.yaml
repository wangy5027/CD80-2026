            text/event-stream:
              schema:
                type: string
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
      - name: Last-Event-ID
        in: header
        schema:
          type: string
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
  /exports:
    post:
      summary: 生成导出文件
      description: 'platform 生成含 test-cases.json 的完整 ZIP：普通能力为 capability.zip，自足组件为 component.zip；original 返回原字节，agent_skills 只含标准 Skill 文件。'
      operationId: post_exports
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 150
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportInput'
  /downloads/{downloadId}:
    get:
      summary: 下载本人产物或导出包
      operationId: get_downloads_downloadId
      responses:
        '200':
          description: 成功
          content:
            application/octet-stream:
              schema:
                type: string
        default:
          description: 错误；状态码与 code 见接口文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: downloadId
        in: path
        required: true
        schema:
          type: string
        description: 不透明资源 ID
  /trials:
    post:
      summary: 自由试用，不产生验证证据
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialRequest'
      responses:
        '202':
          description: 结果（错误见Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 结果（错误见Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trials/{trialId}:
    get:
      summary: 本人试用记录
      parameters:
      - name: trialId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 结果（错误见Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trial'
        default:
          description: 结果（错误见Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /test-cases:
    get:
      summary: 本人用例分页列表
      parameters:
      - name: assetId
        in: query
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 结果（错误见Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseList'
        default:
          description: 结果（错误见Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: 保存不可变个人用例
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCaseInput'
      responses:
        '201':
          description: 结果（错误见Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        default:
          description: 结果（错误见Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /test-cases/{caseId}:
    delete:
      summary: 删除本人用例，保留运行历史
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ok=true
        default:
          description: 结果（错误见Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /official-preparations:
    post:
      summary: 保存或修复官方个人副本并由平台准备依赖
      description: 异步复制精确依赖、实际运行官方Tool样例并准备依赖；主Skill仍需用户效果测试和主动启用。不要求个人MCP或数据源配置。不自动恢复明确禁用/归档的工具。
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, versionId, scope]
              properties:
                confirmDuplicate:
                  type: boolean
                  default: false
                assetId:
                  type: string
                versionId:
                  type: string
                scope:
                  enum: [public, personal]
      responses:
        '202':
          description: 返回后台任务；结果与copy结果相同，通过任务接口观察
        '409':
          description: 重复副本未确认、个人内容已修改或依赖被主动停用
        '503':
          description: 官方服务缺失或不可用，不要求用户填写凭据
  /assets/{assetId}/restore:
    post:
      summary: 恢复本人已删除能力，保持停用
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          description: 错误；不存在或非本人404，修订冲突412，版本变化409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{assetId}/recheck:
    post:
      summary: 重新检查个人版本，不执行测试或继承失效验证
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId]
              properties:
                versionId:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          description: 错误；不存在或非本人404，修订冲突412，版本变化409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{assetId}/official-update:
    post:
      summary: 确认更新到指定官方最新版，保留个人旧版本并停用
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId]
              properties:
                versionId:
                  type: string
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          description: 错误；不存在或非本人404，修订冲突412，版本变化409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ficagent_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - error
      - code
      - requestId
      additionalProperties: false
    Job:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelling
          - cancelled
          - interrupted
          - unknown
        statusUrl:
          type: string
        eventsUrl:
          type: string
        result:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/Error'
        importId:
          type: string
        invocationId:
          type: string
        verificationId:
          type: string
      required:
      - jobId
      - status
      - statusUrl
      - eventsUrl
      additionalProperties: true
    Issue:
      type: object
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - blocker
          - configuration
          - info
        message:
          type: string
        path:
          type: string
        required:
          type: object
          additionalProperties: true
      required:
      - code
      - severity
      - message
      additionalProperties: false
    Asset:
      type: object
      properties:
        personalCopies:
          type: array
          description: 公共目录按当前账号当前个人内容匹配，排除已删除，名称后缀不影响内容摘要
          items:
            type: object
            properties:
              assetId:
                type: string
              name:
                type: string
        displayName:
          type: string
          description: 个人副本展示名称，不修改清单摘要
        deletedAt:
          type: string
          description: 可恢复删除时间；未删除时省略
        configurationStale:
          type: boolean
        officialUpdate:
          type: object
          properties:
            available:
              type: boolean
            versionId:
              type: string
            publicAssetId:
              type: string
            number:
              type: integer
        assetId:
          type: string
        kind:
          type: string
          enum:
          - skill
          - tool
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum:
          - personal
          - public
        sourceIdentity:
          type: string
        lifecycle:
          type: string
          enum:
          - draft
          - active
          - archived
        readiness:
          type: string
          enum:
          - checking
          - needs_configuration
          - blocked
          - unverified
          - verifying
          - verified
          - failed
        enabled:
          type: boolean
        activeVersionId:
          type:
          - string
          - 'null'
        revision:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - assetId
      - kind
      - name
      - scope
      - lifecycle
      - readiness
      - enabled
      - revision
      additionalProperties: true
    AssetPatch:
      type: object
      properties:
        enabled:
          type: boolean
        activeVersionId:
          type: string
        lifecycle:
          type: string
          enum:
          - active
          - archived
      required: []
      additionalProperties: false
    Version:
      type: object
      properties:
        personalCopies:
          type: array
          description: 公共目录按当前账号当前个人内容匹配，排除已删除，名称后缀不影响内容摘要
          items:
            type: object
            properties:
              assetId:
                type: string
              name:
                type: string
        configurationStale:
          type: boolean
        usageGuide:
          type:
          - object
          - 'null'
          description: usageExamples首项兼容字段；无示例时null
          properties:
            title:
              type: string
            description:
              type: string
            prompt:
              type: string
            input:
              type: object
            expected: {}
            assertions:
              $ref: '#/components/schemas/Assertions'
            criteria:
              type: string
            source:
              type: string
            versionId:
              type: string
        versionId:
          type: string
        assetId:
          type: string
        number:
          type: integer
          minimum: 1
        contentDigest: &id004
          type: string
          pattern: ^[a-f0-9]{64}$
        manifest:
          type: object
          additionalProperties: true
        testCases:
          type: array
          minItems: 1
          maxItems: 10
          description: 保存时冻结的原用例；旧版本可只读恢复本人历史提交或静态候选，不是通过证据
          items:
            $ref: '#/components/schemas/VersionTestCase'
        configurationId:
          type:
          - string
          - 'null'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        usageExamples:
          type: array
          description: 随版本的作者示例，或精确匹配的旧版官方示例；不代表用户验证通过
          items:
            type: object
      required:
      - versionId
      - assetId
      - number
      - contentDigest
      - manifest
      additionalProperties: true
    ImportResult:
      type: object
      properties:
        importId:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
        assetId:
          type: string
        versionId:
          type: string
        connectionId:
          type: string
        deduplicated:
          type: boolean
        readiness:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
      required:
      - importId
      - status
      additionalProperties: true
    DraftInput:
      type: object
      properties:
        kind:
          type: string
          enum:
          - skill
          - tool
        name:
          type: string
        description:
          type: string
        baseAssetId:
          type: string
        baseVersionId:
          type: string
        manifest:
          type: object
          additionalProperties: true
        files:
          type: array
          items:
            type: object
            properties:
              path: *id003
              text:
                type: string
              base64:
                type: string
            required:
            - path
            oneOf:
            - required: [text]
            - required: [base64]
            additionalProperties: false
        authoringProvenance:
          type: object
          description: 来源声明与代码摘要，最多32KiB；不构成历史执行或验证证据
          additionalProperties: true
        dependencySnapshots:
          type: array
          maxItems: 16
          items:
            type: object
            description: cd80.component/1完整Tool依赖快照，字节/清单/闭包摘要均检查
        testCases:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/VersionTestCase'
      required:
      - kind
      - name
      additionalProperties: false
    Draft:
      type: object
      properties:
        draftId:
          type: string
        revision:
          type: integer
        content:
          $ref: '#/components/schemas/DraftInput'
      required:
      - draftId
      - revision
      - content
      additionalProperties: true
    GenerateDraft:
      type: object
      properties:
        kind:
          type: string
          enum:
          - skill
          - tool
        taskId:
          type: string
        messageIds:
          type: array
          items:
            type: string
        instruction:
          type: string
        fileIds:
          type: array
          items:
            type: string
      required:
      - kind
      - taskId
      - messageIds
      - instruction
      additionalProperties: false
    ConnectionInput:
      type: object
      properties:
        name:
          type: string
        sourceIdentity:
          type: string
        transport:
          type: string
          enum:
          - streamable_http
        endpoint:
          type: string
          format: uri
        authMode:
          type: string
          enum:
          - none
          - bearer
          - api_key
        headerName:
          type: string
      required:
      - name
      - sourceIdentity
      - transport
      - endpoint
      - authMode
      additionalProperties: false
    Connection:
      type: object
      properties:
        connectionId:
          type: string
        name:
          type: string
        sourceIdentity:
          type: string
        endpoint:
          type: string
        transport:
          type: string
          enum:
          - streamable_http
        authMode:
          type: string
          enum:
          - none
          - bearer
          - api_key
        configured:
          type: boolean
        credentialRevision:
          type: integer
        revision:
          type: integer
      required:
      - connectionId
      - name
      - sourceIdentity
      - endpoint
      - transport
      - authMode
      - configured
      - revision
      additionalProperties: true
    CredentialInput:
      oneOf:
      - type: object
        properties:
          action:
            const: set
          value:
            type: string
            minLength: 1
            writeOnly: true
        required:
        - action
        - value
        additionalProperties: false
      - type: object
        properties:
          action:
            const: clear
        required:
        - action
        additionalProperties: false
    VersionTestCase:
      type: object
      description: 版本原用例，不是验证结果；Skill 的空 criteria 和 Tool 的 null expectation 均待补
      properties:
        label: {type: string, minLength: 1, maxLength: 200}
        input: {type: object}
        fileIds:
          type: array
          maxItems: 8
          items: {type: string}
        expectation:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: true
      required: [label, input, fileIds, expectation]
      additionalProperties: false
    ValidationSuiteInput:
      type: object
      properties:
        assetId: {type: string}
        versionId: {type: string}
        configurationId: {type: string}
